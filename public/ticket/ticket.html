<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket · TechPoint</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../global.css" />
    <script src="../js/tema.js"></script>
  </head>
  <body data-pagina="ticket">
    <header id="encabezado"></header>

    <main class="container py-4 d-flex flex-column align-items-center">
      <div class="card shadow-sm ticket w-100">
        <div class="card-body p-4" id="ticket"></div>
      </div>

      <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
        <button class="btn btn-outline-primary" id="btn-pdf"><i class="bi bi-file-earmark-pdf"></i> Descargar PDF</button>
        <button class="btn btn-primary" id="btn-salir"><i class="bi bi-box-arrow-right"></i> Salir</button>
      </div>
    </main>

    <footer id="pie"></footer>

    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../node_modules/jspdf/dist/jspdf.umd.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/estado.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="ticket.js"></script>
  </body>
</html>
