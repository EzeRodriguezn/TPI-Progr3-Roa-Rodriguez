<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket - RTech Autoservicio</title>
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/tema.css">
  <link rel="stylesheet" href="../css/pagina.css">
</head>
<body data-pagina="ticket">
  <main class="container py-4 d-flex flex-column align-items-center">
    <div class="card shadow-sm ticket w-100">
      <div class="card-body p-4" id="ticket"></div>
    </div>

    <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
      <button type="button" class="btn btn-outline-primary" id="btn-pdf">
        <i class="bi bi-file-earmark-pdf"></i> Descargar PDF
      </button>
      <button type="button" class="btn btn-primary" id="btn-salir">
        <i class="bi bi-box-arrow-right"></i> Salir
      </button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/estado.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/tema.js"></script>
  <script src="../js/layout.js"></script>
  <script src="ticket.js"></script>
</body>
</html>
