<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - TechPoint Autoservicio</title>
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">

  <!-- Bootstrap 5 + iconos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Estilos del proyecto -->
  <link rel="stylesheet" href="../css/tema.css">
  <link rel="stylesheet" href="../css/pagina.css">
</head>
<body data-pagina="productos">
  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0">Elegí tus productos, <span id="nombre-cliente"></span></h1>

      <a href="../carrito/carrito.html" class="btn btn-primary">
        <i class="bi bi-cart3"></i> Carrito: <span data-cart-counter>0</span>
      </a>
    </div>

    <!-- Categorías (las genera productos.js a partir de los productos) -->
    <ul class="nav nav-pills mb-4 justify-content-center" id="tabs"></ul>

    <!-- Grilla responsiva -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4" id="grilla"></div>

    <!-- Paginador -->
    <nav class="mt-4" aria-label="Paginación de productos">
      <ul class="pagination justify-content-center" id="paginacion"></ul>
    </nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/estado.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/tema.js"></script>
  <script src="../js/layout.js"></script>
  <script src="productos.js"></script>
</body>
</html>
