<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos · TechPoint</title>
    <link rel="icon" type="image/svg+xml" href="../img/logo.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../css/pagina.css">
    <link rel="stylesheet" href="../css/tema.css">
  </head>
  <body data-pagina="productos">
    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Elegí tus productos, <span id="nombre-cliente"></span></h1>

        <!-- AQUÍ ESTÁ EL CAMBIO: Convertido en botón con enlace al ticket -->
        <a href="../ticket/ticket.html" class="btn btn-primary">
          <i class="bi bi-cart3"></i> Carrito: <span data-cart-counter>0</span>
        </a>
      </div>

      <ul class="nav nav-pills mb-4" id="tabs"></ul>

      <div class="row g-4 row-cols-1 row-cols-sm-2 row-cols-lg-3" id="grilla">
        <div class="col-12 text-center text-body-secondary py-5">Cargando productos…</div>
      </div>

      <nav aria-label="Paginación de productos">
        <ul class="pagination justify-content-center mt-4" id="paginacion"></ul>
      </nav>
    </main>

    <footer id="pie"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/estado.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/tema.js"></script>
    <script src="../js/layout.js"></script>
    <script src="productos.js"></script>
  </body>
</html>
