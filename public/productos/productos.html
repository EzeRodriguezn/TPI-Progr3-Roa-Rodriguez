<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - TechPoint Autoservicio</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  
  <!-- Estilos del proyecto -->
  <link rel="stylesheet" href="../css/tema.css">
  <link rel="stylesheet" href="../css/pagina.css">
</head>
<body>
  <main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h2>Catálogo de Productos</h2>
      <span id="saludo-cliente" class="fw-bold text-primary fs-5"></span>
    </div>

    <!-- Filtro de Categorías -->
    <ul class="nav nav-pills mb-4 justify-content-center" id="filtro-categorias">
      <li class="nav-item">
        <button class="nav-link active" data-cat="todas">Todos los Productos</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-cat="Teclados">Teclados Mecánicos</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-cat="Auriculares">Auriculares Gamer</button>
      </li>
    </ul>

    <!-- Grilla Responsiva -->
    <div class="row g-4" id="grid-productos"></div>

    <!-- Paginador -->
    <nav class="mt-4">
      <ul class="pagination justify-content-center" id="paginador"></ul>
    </nav>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/tema.js"></script>
  <script src="../js/estado.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="productos.js"></script>
</body>
</html>
