<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos · TechPoint</title>
    <link rel="icon" type="image/svg+xml" href="../img/logo.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../css/pagina.css">
    <link rel="stylesheet" href="../css/tema.css">
  </head>
  <body data-pagina="productos">
    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Elegí tus productos, <span id="nombre-cliente"></span></h1>

        <a href="../ticket/ticket.html" class="btn btn-primary">
          <i class="bi bi-cart3"></i> Carrito: <span data-cart-counter>0</span>
        </a>
      </div>

    <!-- Filtro de Categorías -->
    <ul class="nav nav-pills mb-4 justify-content-center" id="filtro-categorias">
      <li class="nav-item">
        <button class="nav-link active" data-cat="todas">Todos los Productos</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-cat="Teclados">Teclados Mecánicos</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-cat="Auriculares">Auriculares Gamer</button>
      </li>
    </ul>

    <!-- Grilla Responsiva -->
    <div class="row g-4" id="grid-productos"></div>

    <!-- Paginador -->
    <nav class="mt-4">
      <ul class="pagination justify-content-center" id="paginador"></ul>
    </nav>
  </main>

    <footer id="pie"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/estado.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/tema.js"></script>
    <script src="../js/layout.js"></script>
    <script src="productos.js"></script>
  </body>
</html>
