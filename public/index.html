<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido - RTech Autoservicio</title>

  <!-- Estilos Bootstrap y propios -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/pagina.css">
</head>
<body>
  <main class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4 shadow-lg text-center" style="max-width: 420px; width: 100%;">
      <h2 class="mb-3">¡Bienvenido!</h2>
      <p class="text-muted small mb-4">Ingrese su nombre para comenzar a usar el autoservicio.</p>
      
      <form id="form-bienvenida" action="javascript:void(0);">
        <div class="mb-3">
          <input type="text" id="input-nombre" class="form-control form-control-lg text-center" placeholder="Tu nombre..." required autocomplete="off">
        </div>
        <button type="submit" id="btn-continuar" class="btn btn-primary btn-lg w-100">Continuar a Productos</button>
      </form>
    </div>
  </main>

  <!-- Scripts con rutas correctas desde /js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tema.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/bienvenida.js"></script>
</body>
</html>
