<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bienvenida · Rtech</title>
    <link rel="icon" type="image/svg+xml" href="clippy.jpg" />
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="global.css" />
    <script src="js/tema.js"></script>
  </head>
  <body data-pagina="bienvenida">
    <header id="encabezado"></header>

    <main class="container d-flex align-items-center justify-content-center py-5">
      <div class="card shadow-sm w-100" style="max-width: 460px">
        <div class="card-body p-4 text-center">
          <img src="img/logo.svg" alt="Logo" width="72" height="72" class="mb-3" />
          <h1 class="h3">¡Bienvenido a Rtech!</h1>
          <p class="text-body-secondary">Ingresá tu nombre para empezar a comprar.</p>

          <form id="form-bienvenida" class="needs-validation text-start" novalidate>
            <label for="nombre" class="form-label">Tu nombre</label>
            <input type="text" id="nombre" class="form-control form-control-lg" placeholder="Ej: Juan"
                   required minlength="2" maxlength="30" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' ]+" autocomplete="off" />
            <div class="invalid-feedback">Ingresá solo tu nombre (2 a 30 letras, sin números).</div>
            <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">
              Continuar <i class="bi bi-arrow-right"></i>
            </button>
          </form>
        </div>
      </div>
    </main>

    <footer id="pie"></footer>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/estado.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="bienvenida.js"></script>
  </body>
</html>
