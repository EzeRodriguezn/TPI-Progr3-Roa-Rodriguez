<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido - RTech Autoservicio</title>

  <!-- Estilos Bootstrap y propios -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/pagina.css">
</head>
<body class="pantalla-bienvenida">
  <main class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card card-bienvenida p-4 shadow-lg text-center" style="max-width: 420px; width: 100%;">
      <h2 class="mb-3">¡Bienvenido!</h2>
      <p class="text-muted small mb-4">Ingrese su nombre para comenzar a usar el autoservicio.</p>
      
      <form id="form-bienvenida" action="javascript:void(0);">
        <div class="mb-3">
          <input type="text" id="input-nombre" placeholder="Tu nombre..." class="form-control" 
          oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '')">   
        </div>
        <button type="submit" id="btn-continuar" class="btn btn-primary btn-lg w-100">Continuar a Productos</button>
      </form>
    </div>
  </main>

  <!-- Barra de tareas inferior estilo Windows XP -->
  <footer class="xp-taskbar">
    <div class="xp-start-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" class="xp-win-logo">
        <path fill="#f25022" d="M2 4.5l8.5-1.2v8.2H2V4.5z"/>
        <path fill="#7fba00" d="M11.5 3.1L22 1.5v10h-10.5V3.1z"/>
        <path fill="#00a4ef" d="M2 12.5h8.5v8.2L2 19.5v-7z"/>
        <path fill="#ffb900" d="M11.5 12.5H22v10l-10.5-1.6v-8.4z"/>
      </svg>
      <span>Inicio</span>
    </div>

    <div class="xp-window-tab">
      <span>RTech - Autoservicio</span>
    </div>

    <div class="xp-tray">
      <span>Alumnos: Roa - Rodríguez</span>
      <span class="xp-tray-sep"> | </span>
      <span>Tecnicatura Universitaria en Programación - UTN Avellaneda</span>
    </div>

  <!-- Scripts con rutas correctas desde /js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tema.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/bienvenida.js"></script>
</body>
</html>
